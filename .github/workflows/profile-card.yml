name: Update profile card

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:         # "Run workflow" button
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/profile-card.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate card
        env:
          # Defaults to the owner of this repo, i.e. your username.
          # To show a different account, replace with: GH_USERNAME: some-user
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-card.mjs
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-card.svg
          git diff --staged --quiet || (git commit -m "chore: update profile card" && git push)
